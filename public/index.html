<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Script Obfuscator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#07070a] text-gray-100 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="w-full max-w-3xl bg-[#0d0d12] border border-white/10 rounded-2xl p-6 shadow-2xl space-y-4">
        <div>
            <h1 class="text-xl font-bold text-purple-400">Roblox Script Obfuscator</h1>
            <p class="text-xs text-gray-400">Amankan script Lua / Luau Roblox Anda agar terhindar dari pembacaan kasat mata.</p>
        </div>
        
        <div class="space-y-1">
            <label class="text-xs font-semibold text-gray-400 uppercase">Script Mentah (Source Code):</label>
            <textarea id="sourceScript" rows="7" placeholder="print('Halo dunia!')" 
                class="w-full bg-[#070710] border border-white/10 rounded-xl p-3 text-xs text-white font-mono focus:outline-none focus:border-purple-500"></textarea>
        </div>
        
        <button onclick="handleObfuscate()" id="obfuscateBtn" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-semibold py-3 rounded-xl text-xs transition shadow-lg shadow-purple-900/30">
            Obfuscate Script Sekarang
        </button>

        <div class="space-y-1">
            <div class="flex justify-between items-center">
                <label class="text-xs font-semibold text-gray-400 uppercase">Hasil Obfuscate:</label>
                <button onclick="copyResult()" class="text-xs text-purple-400 hover:text-purple-300">Salin Hasil</button>
            </div>
            <textarea id="resultScript" rows="7" readonly placeholder="Hasil kode aman akan muncul di sini..." 
                class="w-full bg-[#070710] border border-white/10 rounded-xl p-3 text-xs text-purple-300 font-mono focus:outline-none"></textarea>
        </div>
    </div>

    <script>
        async function handleObfuscate() {
            const script = document.getElementById('sourceScript').value;
            const btn = document.getElementById('obfuscateBtn');
            if (!script) return alert('Masukkan script terlebih dahulu!');

            btn.innerText = 'Memproses...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/obfuscate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ script })
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('resultScript').value = data.result;
                } else {
                    alert('Gagal: ' + data.message);
                }
            } catch (err) {
                alert('Terjadi kesalahan jaringan!');
            } finally {
                btn.innerText = 'Obfuscate Script Sekarang';
                btn.disabled = false;
            }
        }

        function copyResult() {
            const resultText = document.getElementById('resultScript');
            resultText.select();
            document.execCommand('copy');
            alert('Hasil obfuscate berhasil disalin!');
        }
    </script>
</body>
</html>
